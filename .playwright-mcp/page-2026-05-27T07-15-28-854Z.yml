        - article [ref=e315]:
          - time [ref=e316]: 14:30:20 - 14:30:48
          - paragraph [ref=e317]: 各位好，今天我们进入多元函数极值。先记住一个判断顺序：第一，看有没有约束条件；第二，找驻点；第三，再决定用 Hessian 判别还是拉格朗日乘子法。
        - article [ref=e318]:
          - time [ref=e319]: 14:30:49 - 14:31:08
          - paragraph [ref=e320]: 老师，如果题目只给了一个函数，没有写约束，是不是就直接对 x 和 y 分别求偏导，然后令它们等于零？
        - article [ref=e321]:
          - time [ref=e322]: 14:31:09 - 14:31:42
          - paragraph [ref=e323]: 对。无约束极值先求一阶偏导，解出所有驻点。注意，驻点只是候选点，不等于一定有极值。接下来要看二阶偏导组成的 Hessian 矩阵，也就是 A、B、C 这三个量。
        - article [ref=e324]:
          - time [ref=e325]: 14:31:43 - 14:32:16
          - paragraph [ref=e326]: 那如果 Hessian 判别里面 B 平方减 AC 等于零，这种临界情况考试里应该怎么处理？
        - article [ref=e327]:
          - time [ref=e328]: 14:32:17 - 14:33:05
          - paragraph [ref=e329]: 等于零时二阶判别法失效，不能直接下结论。你们要回到函数定义，沿不同方向代入观察增减性。考试里最容易扣分的地方，就是看到判别式为零还强行写极大或极小。
        - article [ref=e330]:
          - time [ref=e331]: 14:33:06 - 14:33:34
          - paragraph [ref=e332]: 如果出现约束条件，比如 x 平方加 y 平方等于 1，就不要直接套 Hessian。先构造拉格朗日函数，再把原函数和约束方程一起联立求解。
